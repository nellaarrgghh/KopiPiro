<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopipiro - API Shop Client (shop.html)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header mb-4">
        <div class="container py-2 d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="d-flex align-items-center gap-3">
                <a class="site-brand" href="index.php">Kopipiro</a>
                <nav class="d-flex flex-wrap gap-1" aria-label="Primary navigation">
                    <a class="nav-link-item" href="index.php">PHP Menu</a>
                    <a class="nav-link-item active" href="shop.html">API Shop</a>
                    <a class="nav-link-item" href="dashboard.html">API Dashboard</a>
                </nav>
            </div>
            <div id="authStatus" class="small"></div>
        </div>
    </header>

    <main class="container mb-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <div>
                <h1 class="h3 fw-bold mb-1">Kopipiro Interactive API Shop</h1>
                <p class="text-muted small mb-0">Powered by <code>fetch('api/products.php')</code> and <code>fetch('api/orders.php')</code>.</p>
            </div>
            <div id="discountBadge" class="badge bg-secondary p-2">Checking session...</div>
        </div>

        <div id="alertBox" class="alert d-none" role="alert"></div>

        <div class="row g-4">
            <div class="col-12 col-lg-8">
                <div class="card p-3">
                    <h2 class="h5 fw-bold mb-3">Menu Products</h2>
                    <div class="table-responsive">
                        <table class="table table-bordered align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>Image</th>
                                    <th>Product</th>
                                    <th>Price</th>
                                    <th style="width: 120px;">Qty</th>
                                </tr>
                            </thead>
                            <tbody id="productRows">
                                <tr><td colspan="4" class="text-center py-4">Loading products from <code>api/products.php</code>...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-4">
                <div class="card p-3">
                    <h2 class="h5 fw-bold mb-3">Place Order via API</h2>
                    <div class="mb-3">
                        <label for="customerName" class="form-label fw-semibold small">Customer Name</label>
                        <input type="text" id="customerName" class="form-control" value="Guest">
                    </div>
                    <button type="button" id="submitOrderBtn" class="btn btn-primary w-100">Submit Order (POST api/orders.php)</button>
                    <div id="orderResult" class="mt-3 small"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
    let catalog = [];

    function formatRp(n) {
        const val = Number(n) || 0;
        if (val === 0) return 'Free (Rp 0)';
        return 'Rp ' + val.toLocaleString('id-ID');
    }

    async function initShop() {
        const meRes = await fetch('api/auth.php?action=me', { credentials: 'same-origin' });
        const meData = await meRes.json();
        const user = meData.user;
        const authEl = document.getElementById('authStatus');
        const badgeEl = document.getElementById('discountBadge');
        const nameInput = document.getElementById('customerName');

        if (user) {
            authEl.innerHTML = `Signed in as <strong>${user.name}</strong> (${user.role}) <a href="logout.php" class="btn btn-outline-secondary btn-sm ms-2">Log Out</a>`;
            nameInput.value = user.name;
            if (user.role === 'customer') {
                badgeEl.className = 'badge bg-success p-2';
                badgeEl.textContent = 'Member Active: 10% Off Applied';
            } else {
                badgeEl.className = 'badge bg-secondary p-2';
                badgeEl.textContent = `Staff Role (${user.role})`;
            }
        } else {
            authEl.innerHTML = `<a href="login.php" class="btn btn-primary btn-sm">Log In for 10% Off</a>`;
            badgeEl.className = 'badge bg-secondary p-2';
            badgeEl.textContent = 'Guest Mode: Log in for 10% member discount';
        }

        const prodRes = await fetch('api/products.php', { credentials: 'same-origin' });
        const prodData = await prodRes.json();
        catalog = prodData.products || [];
        const tbody = document.getElementById('productRows');
        tbody.innerHTML = catalog.map(p => {
            const hasDisc = p.final_price < p.price && p.price > 0;
            const priceHtml = hasDisc
                ? `<del class="text-muted small">${formatRp(p.price)}</del><br><strong class="text-success">${formatRp(p.final_price)}</strong>`
                : `<strong>${formatRp(p.price)}</strong>`;
            return `<tr>
                <td><img src="${p.image || 'assets/Americano.jpg'}" width="60" height="60" class="product-thumb" alt="${p.name}"></td>
                <td><strong>${p.name.replace(/Frapppe/i, 'Frappe')}</strong><br><span class="badge bg-secondary">${p.category}</span></td>
                <td class="font-monospace small">${priceHtml}</td>
                <td>
                    <label for="api_qty_${p.id}" class="visually-hidden">Quantity for ${p.name}</label>
                    <input type="number" id="api_qty_${p.id}" data-pid="${p.id}" class="form-control form-control-sm api-qty" value="0" min="0" max="99">
                </td>
            </tr>`;
        }).join('');
    }

    document.getElementById('submitOrderBtn').addEventListener('click', async () => {
        const inputs = document.querySelectorAll('.api-qty');
        const items = [];
        inputs.forEach(inp => {
            const q = parseInt(inp.value, 10) || 0;
            if (q > 0) {
                items.push({ product_id: parseInt(inp.dataset.pid, 10), qty: q });
            }
        });
        const resBox = document.getElementById('orderResult');
        if (!items.length) {
            resBox.innerHTML = `<div class="alert alert-danger py-2">Select at least 1 product quantity first.</div>`;
            return;
        }
        const customer_name = document.getElementById('customerName').value.trim() || 'Guest';
        const res = await fetch('api/orders.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ customer_name, items })
        });
        const data = await res.json();
        if (res.ok) {
            resBox.innerHTML = `<div class="alert alert-success py-2">
                <strong>Order Created!</strong><br>
                Code: <code>${data.order_code}</code><br>
                Subtotal: ${formatRp(data.subtotal)}<br>
                Discount: - ${formatRp(data.discount)}<br>
                <strong>Total: ${formatRp(data.total)}</strong><br>
                <a href="sandbox_pay.php?order_code=${encodeURIComponent(data.order_code)}" class="btn btn-success btn-sm mt-2 w-100">Pay Online (Midtrans Sandbox)</a>
            </div>`;
            inputs.forEach(inp => { inp.value = 0; });
        } else {
            resBox.innerHTML = `<div class="alert alert-danger py-2">${data.message || 'Order failed'}</div>`;
        }
    });

    initShop();
    </script>
</body>
</html>
